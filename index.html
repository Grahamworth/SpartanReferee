<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="i18n.js"></script>
<title>SpartanReferee: sign in</title>
<meta name="description" content="SpartanReferee, for Spartan's referees: your events, your training and the burpee cameras. Sign in, or register from your invite.">
<meta name="theme-color" content="#1a1e24" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="icon" href="icons/spartanreferee/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/spartanreferee/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="headjudge.css">
<link rel="stylesheet" href="study.css">
<script src="look.js"></script>
<style>
  .login { max-width: 440px; margin: clamp(16px, 8vh, 72px) auto 0; }
  .login h1 { margin: 0 0 6px; }
  .login .note { margin-bottom: 18px; }
  .loginLinks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin: 22px auto 0; max-width: 440px; font-size: .95rem; }
</style>
</head>
<body>
<!-- The front page (from 19 November 2026): signing in, and nothing else. Signed in already, it goes straight to the app (learn/).
     What SpartanReferee is and how it works is on info.html. -->
<header class="top">
  <a class="mark" href="./">Spartan<span>Referee</span></a>
  <span class="topRight"><select class="langPick" data-lang-picker aria-label="Language"></select></span>
</header>
<main class="page">
  <section class="card login">
    <h1>Sign in</h1>
    <p class="note">For Spartan's referees. New here? Open the link in the invite an admin emailed you to register.</p>
    <div id="msBtn"></div>
    <div id="devBtn"></div>
    <p class="error" id="signInError" role="alert" hidden></p>
  </section>
  <nav class="loginLinks" aria-label="More">
    <a href="info.html">About SpartanReferee</a>
    <a href="streaming.html">Camera setup guide</a>
    <a href="privacy.html">Privacy</a>
  </nav>
</main>
<script type="module">
  import { signedIn, devSignInButton } from './api-base.js';
  import { microsoftButton } from './email-signin-web.js';
  if (signedIn()) location.replace('learn/');
  else {
    const failed = (e) => { const p = document.getElementById('signInError'); p.textContent = e.message || 'Sign-in didn\'t work: try again'; p.hidden = false; };
    microsoftButton(document.getElementById('msBtn'), 'learn/', failed);
    devSignInButton(document.getElementById('devBtn'), () => location.replace('learn/'), failed);
  }
</script>
</body>
</html>

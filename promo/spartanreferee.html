<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SpartanReferee promo</title>
<!-- The promo video (19 November 2026), as a page that draws any moment: render(t) for t in seconds. promo/render-spartanreferee.mjs steps through it
     at 30 frames a second in headless Chrome and ffmpeg makes the MP4. The phone pictures are promo/shots (promo/shoot.mjs); the
     obstacle animations are the site's own (learn/obstacle-anim.js, learn/obstacle-scenes.js), drawn live. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;600;700&display=block">
<link rel="stylesheet" href="../study.css"><link rel="stylesheet" href="../learn/learn.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d1015; }
  :root { --brand: #e2231a; --bg: #111418; --panel: #1a1e24; --text: #eef1f4; --muted: #a5adb8; --line: #333a43; --soft: #232933; --accent: #3ddc97; --bad: #ff8a80; --warn: #f2b33d; --primary-text: #92b2ff; }
  #stage { position: absolute; inset: 0; overflow: hidden; font-family: Barlow, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 75% 40%, #1d2430 0%, #0d1015 70%); }
  .stripe { position: absolute; width: 2600px; height: 120px; background: var(--brand); transform-origin: 0 0; opacity: .9; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .h1 { position: absolute; font: italic 800 132px/0.92 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: -1px; }
  .h2 { position: absolute; font: italic 800 96px/0.95 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  .h2 em, .h1 em { font-style: italic; color: var(--brand); }
  .sub { position: absolute; font: 600 40px/1.3 Barlow, sans-serif; color: #c9d1db; }
  .chipRow { position: absolute; display: flex; flex-wrap: wrap; gap: 14px; }
  .chip2 { font: 700 30px/1 Barlow, sans-serif; padding: 14px 24px; border-radius: 999px; border: 2px solid #3a4250; background: #161b22; color: #fff; }
  .chip2.g { border-color: var(--accent); color: var(--accent); } .chip2.r { border-color: var(--bad); color: var(--bad); }
  .phone { position: absolute; width: 430px; height: 930px; border-radius: 62px; background: #050608; box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 3px #2a303a inset; padding: 14px; box-sizing: border-box; }
  .phone .scr { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; position: relative; background: #111; }
  .phone img { width: 100%; display: block; transform-origin: 50% 0; }
  .phone .notch { position: absolute; left: 50%; top: 24px; width: 120px; height: 30px; margin-left: -60px; border-radius: 20px; background: #050608; z-index: 2; }
  .logo { position: absolute; display: flex; align-items: center; gap: 34px; }
  .logo img { width: 190px; height: 190px; border-radius: 40px; }
  .word { font: italic 800 150px/1 'Barlow Condensed', sans-serif; letter-spacing: -2px; }
  .word span { color: var(--brand); }
  .animBox { position: absolute; border-radius: 28px; overflow: hidden; background: #111418; box-shadow: 0 30px 100px rgba(0,0,0,.55); }
  .animBox svg { display: block; width: 100%; height: 100%; }
  .cap { position: absolute; font: 700 44px/1.25 Barlow, sans-serif; padding: 22px 34px; border-radius: 20px; background: rgba(13, 16, 21, .88); border: 2px solid #333a43; }
  .cap b { font-weight: 800; margin-right: 14px; } .cap.g b { color: var(--accent); } .cap.r b { color: var(--bad); }
  .tag { position: absolute; font: 700 28px/1 Barlow, sans-serif; padding: 12px 22px; border-radius: 999px; background: #161b22; border: 2px solid #3a4250; }
  .langs { position: absolute; display: grid; grid-template-columns: repeat(5, 230px); gap: 18px; }
  .langs div { font: 700 38px/1 Barlow, sans-serif; padding: 22px 0; text-align: center; border-radius: 18px; background: #161b22; border: 2px solid #2d3440; }
  .url { position: absolute; font: 600 34px/1 Barlow, sans-serif; color: #c9d1db; letter-spacing: .5px; }
</style></head>
<body><div id="stage"><div class="bg"></div><div class="stripe" id="stripe"></div><div id="layers"></div></div>
<script type="module">
import { sample, solve, figure, pointOf } from '../learn/obstacle-anim.js';
import { SCENES } from '../learn/obstacle-scenes.js';

const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const shot = (n) => `shots/${n}.png`;

// ---------------------------------------------------------------- the scenes: [start, end] seconds, and their markup
const SC = [
  { id: 'intro', t: [0, 5.6], html: `
      <div class="logo" id="logo" style="left:200px;top:110px"><img src="../icons/spartanreferee/icon-512.png" alt=""><div class="word">SPARTAN<span>REFEREE</span></div></div>
      <div class="sub" id="tagline" style="left:430px;top:330px;font-size:52px">Fair. Consistent. Ready.</div>
      <div class="animBox" id="introAnim" style="left:200px;top:440px;width:1520px;height:570px"><svg viewBox="0 50 400 150" preserveAspectRatio="xMidYMid slice"><g class="obWorld"></g></svg></div>` },
  { id: 'obst', t: [5.2, 11.6], html: `
      <div class="h2" style="left:150px;top:200px">Every obstacle,<br><em>explained</em></div>
      <div class="sub" style="left:150px;top:440px;width:820px">40 obstacle types from the 2026 rulebook: how it’s done, what counts, and what’s a fail.</div>
      <div class="chipRow" style="left:150px;top:640px;width:860px"><span class="chip2">Multiple attempts</span><span class="chip2">One attempt</span><span class="chip2">Mandatory</span><span class="chip2">Search</span></div>
      <div class="phone" id="p1" style="left:1180px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('obstacles')}"></div></div>
      <div class="phone" id="p2" style="left:1440px;top:115px;transform:scale(.9);transform-origin:0 0"><div class="notch"></div><div class="scr"><img src="${shot('good-bad')}"></div></div>` },
  { id: 'anim', t: [11.2, 22.4], html: `
      <div class="h2" id="animTitle" style="left:150px;top:90px;font-size:84px">See what counts. <em>See what’s a fail.</em></div>
      <div class="animBox" id="bigAnim" style="left:150px;top:230px;width:1620px;height:760px"><svg viewBox="0 0 400 225"><g class="obWorld"></g></svg></div>
      <div class="tag" id="animTag" style="left:190px;top:270px">Real speed</div>
      <div class="cap" id="animCap" style="left:190px;top:860px"></div>` },
  { id: 'call', t: [22.0, 27.6], html: `
      <div class="h2" style="left:150px;top:230px">Make<br><em>the call</em></div>
      <div class="sub" style="left:150px;top:470px;width:760px">Real race-day situations. Tap an answer, see the right call and why.</div>
      <div class="phone" id="p3" style="left:1000px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('make-the-call')}"></div></div>
      <div class="phone" id="p4" style="left:1450px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('obstacle-video')}"></div></div>
      <div class="tag" style="left:150px;top:690px">▶ Demonstration videos, with captions in your language</div>` },
  { id: 'learn', t: [27.2, 33.6], html: `
      <div class="phone" id="p5" style="left:150px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('lesson-anim')}"></div></div>
      <div class="phone" id="p6" style="left:620px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('programme')}"></div></div>
      <div class="h2" style="left:1170px;top:230px">Learn on<br><em>your phone</em></div>
      <div class="sub" style="left:1170px;top:470px;width:640px">Short narrated lessons with animations, quick checks, and Referee Essentials for new referees. Works offline at the venue.</div>` },
  { id: 'lang', t: [33.2, 39.0], html: `
      <div class="h2" style="left:150px;top:120px"><em>15</em> languages</div>
      <div class="langs" id="langs" style="left:150px;top:330px">${['English', 'Français', 'Deutsch', 'Nederlands', 'Español', 'Italiano', 'Ελληνικά', 'Hrvatski', 'Čeština', 'Polski', 'Suomi', 'Svenska', 'Dansk', 'العربية', 'ไทย'].map((l) => `<div>${l}</div>`).join('')}</div>
      <div class="phone" id="p7" style="left:1420px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('german')}"></div></div>` },
  { id: 'edit', t: [38.6, 44.4], html: `
      <div class="phone" id="p8" style="left:150px;top:75px"><div class="notch"></div><div class="scr"><img src="${shot('editor')}"></div></div>
      <div class="h2" style="left:700px;top:200px">Build lessons<br><em>in place</em></div>
      <div class="sub" style="left:700px;top:440px;width:1050px">Edit text, questions and translations where they sit. Add a drawing, an animation, your own picture or video, or a YouTube link. Publish when it’s ready.</div>
      <div class="chipRow" style="left:700px;top:680px;width:1050px"><span class="chip2">Drawing</span><span class="chip2">Animation</span><span class="chip2">Picture or video</span><span class="chip2">YouTube link</span></div>` },
  { id: 'end', t: [44.0, 49.0], html: `
      <div class="logo" id="logo2" style="left:330px;top:330px"><img src="../icons/spartanreferee/icon-512.png" alt=""><div class="word">SPARTAN<span>REFEREE</span></div></div>
      <div class="sub" style="left:560px;top:560px;font-size:46px">Referee training for Spartan Race</div>
      <div class="url" style="left:560px;top:650px">brave-forest-022879f03.3.azurestaticapps.net</div>` },
];
export const DURATION = 49;
$('#layers').innerHTML = SC.map((s) => `<div class="layer" id="L-${s.id}">${s.html}</div>`).join('');

// ---------------------------------------------------------------- the site's animations, drawn at a given moment
const scenes = { walls: SCENES.walls(), monkey: SCENES.monkey(), spear: SCENES.spear(), burpee: SCENES.burpee() };
function drawAnim(svg, sc, tl, time, mark) {
  const s = sample(tl, time), P = solve(s), c = s.cam;
  const H = mark && mark.kind === 'bad' ? new Set(mark.hl || []) : new Set();
  const q = mark ? (typeof mark.at === 'function' ? mark.at(s, P) : pointOf(P, mark.at)) : null;
  const ring = q ? `<circle class="obRing ${mark.kind === 'bad' ? 'bad' : 'good'}" cx="${q[0]}" cy="${q[1]}" r="13"/>` : '';
  const g = svg.querySelector('.obWorld');
  g.setAttribute('transform', `translate(200 112) scale(${c[2]}) translate(${-c[0]} ${-c[1]})`);
  g.innerHTML = `${sc.back(s, H, P, time * 1000)}${figure(P, mark && mark.kind === 'bad' && mark.body ? 'hlFig' : '')}${sc.front ? sc.front(s, H, P, time * 1000) : ''}${ring}`;
}
/** a timeline played from a to b over the given seconds, then held on b, with the mark at b shown during the hold */
function clip(local, from, to, secs) { return from + (to - from) * clamp(local / secs); }

// the big animation scene: the spear at real speed; then it slowed down onto the stick (✓); then the monkey bars' feet fail slowed (✗); then the bell (✓)
const spearGood = scenes.spear.good, spearHit = spearGood.marks.find((m) => !m.kind);
const monkeyFeet = scenes.monkey.fails[0], feetMark = monkeyFeet.marks.find((m) => m.kind === 'bad');
const monkeyGood = scenes.monkey.good, bellMark = monkeyGood.marks.find((m) => !m.kind);
function bigAnim(local) {
  const svg = $('#bigAnim svg'), tag = $('#animTag'), cap = $('#animCap');
  let sc, tl, time, mark = null, label, text = '', kind = '';
  if (local < 3.4) { sc = scenes.spear; tl = spearGood; time = clip(local, 0.4, spearHit.t + 0.05, 3.0); label = 'Real speed'; }
  else if (local < 5.6) { sc = scenes.spear; tl = spearGood; time = spearHit.t; mark = { ...spearHit, kind: 'good' }; label = 'What counts'; text = spearHit.text; kind = 'g'; }
  else if (local < 8.6) { sc = scenes.monkey; tl = monkeyFeet; time = clip(local - 5.6, feetMark.t - 1.0, feetMark.t, 3.0); label = 'Slow motion: a fail'; }
  else { sc = scenes.monkey; tl = monkeyFeet; time = feetMark.t; mark = { ...feetMark, kind: 'bad' }; label = 'Slow motion: a fail'; text = feetMark.text; kind = 'r'; }
  drawAnim(svg, sc, tl, time, mark);
  tag.textContent = label;
  cap.style.opacity = text ? 1 : 0;
  cap.className = `cap ${kind}`; cap.innerHTML = text ? `<b>${kind === 'r' ? '✗' : '✓'}</b>${text}` : '';
}

// ---------------------------------------------------------------- one moment
window.render = (t) => {
  // the red stripe sweeps across between scenes
  const st = $('#stripe'); st.style.transform = `translate(${-300 + ((t * 90) % 600) - 300}px, ${880 - Math.sin(t / 3) * 20}px) rotate(-8deg)`; st.style.opacity = 0.18;
  for (const s of SC) {
    const el = document.getElementById(`L-${s.id}`), [a, b] = s.t, k = clamp((t - a) / 0.5) * (1 - clamp((t - (b - 0.5)) / 0.5));
    el.style.opacity = k; el.style.visibility = k > 0 ? 'visible' : 'hidden';
    el.style.transform = `translateY(${(1 - out(clamp((t - a) / 0.7))) * 40}px)`;
    if (k <= 0) continue;
    const local = t - a;
    // phones drift up slowly, and their pictures zoom in a touch
    for (const p of el.querySelectorAll('.phone')) {
      const i = +p.id.slice(1), d = (i % 2 ? 1 : -1);
      p.querySelector('img').style.transform = `scale(${1 + local * 0.006})`;
      p.style.translate = `0 ${(1 - out(clamp((local - 0.1 * (i % 3)) / 0.9))) * 160 - local * 4 * d}px`;
    }
    if (s.id === 'intro') {
      $('#logo').style.transform = `translateX(${(1 - out(local / 0.9)) * -120}px)`;
      $('#tagline').style.opacity = clamp((local - 0.8) / 0.6);
      drawAnim($('#introAnim svg'), scenes.walls, scenes.walls.good, clip(local - 0.6, 0.6, scenes.walls.good.end, 4.6), null);
    }
    if (s.id === 'anim') bigAnim(local);
    if (s.id === 'lang') [...el.querySelectorAll('#langs div')].forEach((d, i) => { const k2 = out(clamp((local - 0.3 - i * 0.12) / 0.4)); d.style.opacity = k2; d.style.transform = `translateY(${(1 - k2) * 30}px)`; });
    if (s.id === 'end') $('#logo2').style.transform = `scale(${0.92 + 0.08 * out(local / 1.2)})`;
  }
};
// ready once the fonts and pictures are in
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })))]).then(() => { window.render(0); return true; });
window.DURATION = DURATION;
</script></body></html>

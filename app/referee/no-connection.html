<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpartanReferee</title>
<!-- The SpartanReferee phone app's own page (scripts/build-app.sh), the only one carried in the app: it shows when the site can't be
     reached and the phone has no copy of it yet (the first time the app opens, with no signal). After that the site's service
     worker opens the saved lessons, rules and handbook offline. Its texts are translated by i18n/<code>.json, which build-app.sh
     puts in below (the app can't load the site's dictionaries without the site). -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #f2f2f2;
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 420px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.6rem; margin: 18px 0 8px; }
  p { margin: 0 0 10px; color: #c9c9c9; }
  button { margin-top: 14px; font: 700 1.05rem system-ui, sans-serif; color: #fff; background: #e2231a; border: 0; border-radius: 10px; padding: 14px 28px; min-width: 200px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1 data-t>You're offline</h1>
  <p data-t>SpartanReferee needs a connection the first time it opens.</p>
  <p data-t>After that, what you've saved on this phone opens with no signal.</p>
  <button type="button" data-t>Try again</button>
</main>
<script>
  const SITE = '__SITE__', STRINGS = /*STRINGS*/{};
  const lang = (navigator.languages || [navigator.language]).map((l) => String(l).toLowerCase().split('-')[0]).find((l) => STRINGS[l]);
  if (lang) {
    document.documentElement.lang = lang;
    if (lang === 'ar') document.documentElement.dir = 'rtl';
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = STRINGS[lang][el.textContent.trim()] || el.textContent;
  }
  document.querySelector('button').onclick = () => { location.href = `${SITE}/learn/`; };
</script>
</body>
</html>
